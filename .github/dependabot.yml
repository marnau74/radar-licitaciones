version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: monthly
    groups:
      dependencias:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    # La versión mayor de TypeScript la marca Angular: se sube con Angular, no antes.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint", "typescript"]
      dependencias:
        patterns: ["*"]
  # Las acciones van fijadas por SHA (con la versión en un comentario): Dependabot actualiza las dos cosas.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      acciones:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    schedule:
      interval: monthly
    # Node y Java se quedan en su versión LTS (24 y 25): el salto de versión mayor se decide a mano.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
    groups:
      imagenes:
        patterns: ["*"]
