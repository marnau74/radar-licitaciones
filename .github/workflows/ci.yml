name: ci

on:
  push:
    branches: [main]
  pull_request:
  # La llama «publicar» antes de construir las imágenes: no se publica nada que no pase la CI.
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Formato (Spotless), compilación con los avisos como errores, tests con PostgreSQL, Keycloak y Mailpit
      # reales (Testcontainers: los runners de GitHub traen Docker), verificación de módulos y cobertura.
      - name: Verificar
        run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-informes
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/
            backend/target/spring-modulith-docs/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Formato
        run: npm run formato:comprobar
      - name: Lint (incluida la accesibilidad de las plantillas)
        run: npm run lint
      - name: Tests con cobertura
        run: npm run test:cobertura
      - name: Compilar
        run: npm run build
      - name: Dependencias con vulnerabilidades conocidas
        run: npm audit --omit=dev --audit-level=high

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Levantar la aplicación completa (imágenes construidas aquí)
        run: docker compose -f compose.e2e.yaml up -d --build --wait
      - name: Playwright
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Registros si algo falla
        if: failure()
        run: docker compose -f compose.e2e.yaml logs --no-color --tail=300
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  repositorio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sin rutas locales ni correos personales
        run: |
          if git grep -nIiE '([a-z]:[\/]+users[\/]|/home/[a-z0-9_-]+/|@(gmail|hotmail|outlook|yahoo)\.)'; then
            echo "Hay datos personales en el repositorio" && exit 1
          fi
      - name: Compose de producción válido (con valores de relleno)
        working-directory: deploy
        run: |
          cp .env.ejemplo .env
          sed -i 's/^\([A-Z_]*CLAVE\)=$/\1=x/; s/^SMTP_HOST=$/SMTP_HOST=smtp.ejemplo.es/' .env
          docker compose config --quiet
      - name: Scripts de shell
        run: shellcheck deploy/postgres/*.sh
