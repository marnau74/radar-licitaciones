# Entorno de desarrollo: base de datos, Keycloak y un servidor de correo de pruebas.
# La API (backend/) y la web (frontend/) se arrancan aparte, en local:
#
#   docker compose up -d
#   cd backend && ./mvnw spring-boot:run
#   cd frontend && npm start
#
# Las cuentas de ejemplo (ficticias) están en infra/keycloak/realm-radar.json.
name: radar-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
    ports:
      - "5433:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./infra/keycloak/realm-radar.json:/opt/keycloak/data/import/realm-radar.json:ro

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  datos-postgres:
